<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM CRITICAL WARNING</title>
    <style>
        body {
            background-color: black;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            user-select: none;
        }
        #terminal {
            font-size: 18px;
            line-height: 1.5;
        }
        .red-text { color: #ff0000; font-weight: bold; }
        
        /* شاشة الفدية والمرعبات */
        #ransom {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            border: 15px solid #ff0000;
            box-sizing: border-box;
            color: #ffffff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 9999;
            animation: shake 0.1s infinite alternate;
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            100% { transform: translate(-2px, -2px); }
        }

        .skull {
            font-size: 80px;
            color: red;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 40px;
            color: #ff0000;
            text-shadow: 2px 2px #550000;
            margin: 10px 0;
        }

        .alert-box {
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid red;
            padding: 20px;
            border-radius: 10px;
            max-width: 80%;
            margin-top: 15px;
        }

        .price {
            color: #ffea00;
            font-size: 32px;
            font-weight: bold;
            margin: 15px 0;
        }

        .timer {
            font-size: 28px;
            color: #ff0000;
            background: #220000;
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="terminal">
        [SYSTEM INIT] -> Injecting root payload...<br>
        [BYPASS] -> Firewall security compromised...<br>
    </div>

    <div id="ransom">
        <div class="skull">☠️</div>
        <h1>تم اختراق الجهاز بنجاح!</h1>
        
        <div class="alert-box">
            <p style="font-size: 22px; margin: 0;">هل تريد ملفاتك ومعلوماتك الشخصية وصورك؟</p>
            <p class="price">ادفع 500,000 دولار فوراً لكي ترجع معلوماتك وملفاتك! هاهاهاها 😈</p>
            <p style="font-size: 16px; color: #aaa;">سيتم مسح كارت الشاشة والهاردسك بالكامل فور انتهاء العداد:</p>
            <div class="timer" id="countdown">00:59:59</div>
        </div>
    </div>

    <script>
        const glitchLines = [
            "ACCESSING_PRIVATE_GALLERY... [SUCCESS]",
            "EXTRACTING_PASSWORDS_AND_ACCOUNTS... [DONE]",
            "KITCHEN_PROTOCOL_OVERRIDE... [OK]",
            "BATHROOM_CAMERA_STREAM... [CONNECTED]",
            "STEAK_SUPPLY_CHAIN_ENCRYPTED... [LOCKED]",
            "DELETING_SYSTEM32_FILES... [45%]",
            "DELETING_PHOTOS_AND_VIDEOS... [89%]",
            "LOCKING_PRIMARY_HARD_DRIVE...",
            "SENDING_DATA_TO_DARKWEB_SERVER...",
            "CRITICAL_FATAL_ERROR_SYSTEM_DESTROYED"
        ];

        const term = document.getElementById('terminal');
        let index = 0;

        const interval = setInterval(() => {
            if (index >= glitchLines.length) {
                clearInterval(interval);
                document.getElementById('ransom').style.display = 'flex';
                startTimer();
                return;
            }
            term.innerHTML += `<span class="red-text">> [VIRUS_EXEC]</span> ${glitchLines[index]}<br>`;
            window.scrollTo(0, document.body.scrollHeight);
            index++;
        }, 200);

        function startTimer() {
            let time = 3599; // 1 hour
            const timerEl = document.getElementById('countdown');
            setInterval(() => {
                let minutes = Math.floor(time / 60);
                let seconds = time % 60;
                seconds = seconds < 10 ? '0' + seconds : seconds;
                minutes = minutes < 10 ? '0' + minutes : minutes;
                timerEl.innerText = `00:${minutes}:${seconds}`;
                if (time > 0) time--;
            }, 1000);
        }
    </script>
</body>
</html>
